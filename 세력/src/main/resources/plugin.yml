name: FactionCore
version: ${project.version}
main: com.elcserver.faction.FactionCore
api-version: '1.20'
author: ELCServer
description: 세력·코어 시스템 플러그인
depend: [Vault]
softdepend: [Essentials, LuckPerms]

commands:
  세력:
    description: 세력 관련 명령어
    usage: /<command> <subcommand>
    aliases: [faction, f]
  코어:
    description: 코어 관련 명령어
    usage: /<command> <subcommand>
    aliases: [core]
  쿤:
    description: 쿤 화폐 관련 명령어
    usage: /<command> [잔액|확인|보내기|지급|차감|설정|도움말]
    aliases: [kun, money]

permissions:
  faction.admin:
    description: 세력 관리자 권한
    default: op
  faction.use:
    description: 세력 기본 사용 권한
    default: true
